[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sumdoc"
version = "0.2.12"
description = "Small Unix-style document conversion tools in one multicall command."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "COPYING"]
authors = [
    {name = "William Martinez Bas", email = "metfar@gmail.com"},
]
keywords = ["pdf", "markdown", "html", "images", "ocr", "ascii", "ansi", "braille", "semigraphics", "unix", "multicall"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = [
    "Markdown>=3.5",
    "markdownify>=0.11",
]

[project.scripts]
sumdoc = "sumdoc.cli:entry_point"

# Installed multicall launchers.  All of these dispatch through the same
# SumDoc entry point; the invoked filename selects the tool.
image2text = "sumdoc.cli:entry_point"
image2ascii = "sumdoc.cli:entry_point"
image2ansi = "sumdoc.cli:entry_point"
image2braille = "sumdoc.cli:entry_point"
text2image = "sumdoc.cli:entry_point"
writeOnImage = "sumdoc.cli:entry_point"
writeonimage = "sumdoc.cli:entry_point"
png2webp = "sumdoc.cli:entry_point"
image2webp = "sumdoc.cli:entry_point"
webp2png = "sumdoc.cli:entry_point"
image2png = "sumdoc.cli:entry_point"
pdf2png = "sumdoc.cli:entry_point"
pdf2txt = "sumdoc.cli:entry_point"
pdf2text = "sumdoc.cli:entry_point"
png2text = "sumdoc.cli:entry_point"
png2md = "sumdoc.cli:entry_point"
image2md = "sumdoc.cli:entry_point"
markdown2helpdb = "sumdoc.cli:entry_point"
md2helpdb = "sumdoc.cli:entry_point"
helpdb2markdown = "sumdoc.cli:entry_point"
helpdb2md = "sumdoc.cli:entry_point"
clipinfo = "sumdoc.cli:entry_point"
clipboard-info = "sumdoc.cli:entry_point"
clipbesttype = "sumdoc.cli:entry_point"
clipboard-best = "sumdoc.cli:entry_point"
clip2md = "sumdoc.cli:entry_point"
clipboard2md = "sumdoc.cli:entry_point"
clip2png = "sumdoc.cli:entry_point"
clipboard2png = "sumdoc.cli:entry_point"
clip2rtf = "sumdoc.cli:entry_point"
clipboard-save = "sumdoc.cli:entry_point"
md2rich = "sumdoc.cli:entry_point"
lessrich = "sumdoc.cli:entry_point"
markdown2rich = "sumdoc.cli:entry_point"
md2html = "sumdoc.cli:entry_point"
markdown2html = "sumdoc.cli:entry_point"
html2md = "sumdoc.cli:entry_point"
html2markdown = "sumdoc.cli:entry_point"
md2pdf = "sumdoc.cli:entry_point"
md2pdfpipe = "sumdoc.cli:entry_point"
markdown2pdf = "sumdoc.cli:entry_point"

[project.optional-dependencies]
help = [
    "sumtui>=0.8.0a29",
]
image = [
    "Pillow>=10",
]
pdf = [
    "PyMuPDF>=1.22",
    "pdfminer.six>=20221105",
]
markdown = [
    "WeasyPrint>=60",
]
rich = [
    "rich>=13",
]
ocr = [
    "opencv-python>=4.8",
    "pytesseract>=0.3.10",
    "img2table>=1.2",
    "tabulate>=0.9",
]
all = [
    "sumtui>=0.8.0a29",
    "Pillow>=10",
    "PyMuPDF>=1.22",
    "pdfminer.six>=20221105",
    "WeasyPrint>=60",
    "rich>=13",
    "opencv-python>=4.8",
    "pytesseract>=0.3.10",
    "img2table>=1.2",
    "tabulate>=0.9",
]
dev = [
    "build>=1.2",
    "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
sumdoc = ["styles/*.css"]
